<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | Bika Ambon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>

<body class="bg-wavy-pattern login-page-body">

  <header class="dash-header">
    <div class="container">
      <a href="index.html" class="dash-logo">
        Bika Ambon
        <span>Kelompok 1</span>
      </a>
    </div>
  </header>

  <main class="login-main">
    <div class="login-card">
      <h2>Masuk</h2>
      <p class="login-subtitle">// login untuk Admin &amp; Pelanggan</p>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="admin / user" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-field-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan password"
              required>
            <button type="button" class="btn-toggle-password" id="togglePasswordBtn">Tampilkan</button>
          </div>
        </div>

        <button type="submit" class="btn-submit-ticket">Masuk</button>
      </form>

      <p class="login-hint" style="text-align:center;">
        Belum punya akun? <a href="signup.html" style="color: var(--accent-amber-dark); font-weight: 700;">Daftar di
          sini</a>
      </p>

      <a href="index.html" class="login-back-link">&larr; Kembali ke halaman utama</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>

</html>
