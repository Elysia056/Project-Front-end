<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Saya | Bika Ambon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="bg-wavy-pattern dash-body">

  <header class="dash-header">
    <div class="container">
      <a href="index.html" class="dash-logo">
        Bika Ambon
        <span>Kelompok 1</span>
      </a>

      <div class="dash-user-info">
        <span class="dash-role-badge">Pelanggan</span>
        <span id="userNameLabel">-</span>
        <button type="button" class="btn-logout" id="logoutBtn">Keluar</button>
      </div>
    </div>
  </header>

  <main class="dash-main">
    <div class="container">
      <h1 class="dash-page-title">Dashboard Saya</h1>
      <p class="dash-page-subtitle">// pesanan atas nama akun <span id="userEmailLabel">-</span></p>

      <div class="dash-panel">
        <table class="dash-table">
          <thead>
            <tr>
              <th>Tiket</th>
              <th>Varian</th>
              <th>Jumlah</th>
              <th>Tanggal</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabelPesananSayaBody"></tbody>
        </table>

        <div class="dash-empty-state" id="emptyStateUser">
          Anda belum memiliki pesanan. Gunakan email yang sama pada form pemesanan agar pesanan Anda muncul di sini.
        </div>
      </div>

      <a href="index.html#pesan" class="dash-cta-link">Pesan Bika Ambon &rarr;</a>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="user.js"></script>
</body>
</html>
